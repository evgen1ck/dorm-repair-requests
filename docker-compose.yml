name: dormitory

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-dormitory}

x-backend: &backend
  image: dormitory-backend:latest
  build:
    context: .
    dockerfile: dockerfiles/backend.Dockerfile
  restart: unless-stopped
  environment:
    <<: *postgres-env
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
    TIMEZONE: ${TIMEZONE:-Europe/Moscow}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: *postgres-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["db", "upgrade"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    command: ["run-api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: dormitory-frontend:latest
    build:
      context: .
      dockerfile: dockerfiles/frontend.Dockerfile
    restart: unless-stopped
    environment:
      NGINX_PORT: ${NGINX_PORT:-8000}
    ports:
      - "${NGINX_PORT:-8000}:${NGINX_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$NGINX_PORT/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
